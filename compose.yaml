services:
  youtrack:
    image: docker.io/jetbrains/youtrack:2026.2.19840
    container_name: youtrack
    restart: unless-stopped

    # Rootless Podman: map your host user to container UID/GID 13001
    # (the user YouTrack runs as) so bind mounts need no sudo chown.
    userns_mode: "keep-id:uid=13001,gid=13001"

    ports:
      - "${YOUTRACK_PORT}:8080"

    environment:
      YOUTRACK_BASE_URL: http://${YOUTRACK_HOST}:${YOUTRACK_PORT}

    volumes:
      - ./data:/opt/youtrack/data
      - ./conf:/opt/youtrack/conf
      - ./logs:/opt/youtrack/logs
      - ./backups:/opt/youtrack/backups